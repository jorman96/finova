name: Verify Finova
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: demo-finova
      NEXT_PUBLIC_FIREBASE_API_KEY: fake-key
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: demo-finova.firebaseapp.com
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: demo-finova.appspot.com
      NEXT_PUBLIC_FIREBASE_APP_ID: fake-app
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm install --global firebase-tools@15.19.0
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run test:rules
      - run: npm run test:integration
      - run: npm run build
